[package]
name = "libzcashlc"
version = "4.0.0"
authors = [
  "Jack Grigg <thestr4d@gmail.com>",
  "Lukas Korba <lukas@zodl.com>",
  "Kris Nuttycombe<kris@nutty.land>",
  "Francisco Gindre",
]
license = "MIT"
edition = "2024"
rust-version = "1.90"
build = "rust/build.rs"

[dependencies]

# Zcash
#
# NU7 crate set (ZChat fork): the stable crates.io versions the Android fork ships in
# zcash-android-sdk 3.0.0-nu7-zchat.3 (backend-lib/Cargo.toml at a99a745e). No [patch] below.
orchard = { version = "0.16" }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
transparent = { package = "zcash_transparent", version = "0.11.0", default-features = false }
zcash_address = { version = "0.14.0" }
zcash_client_backend = { version = "0.25.0", features = [
  "lightwalletd-tonic-tls-webpki-roots",
  "orchard",
  "pczt",
  "tor",
  "transparent-inputs",
  "unstable",
] }
zcash_client_sqlite = { version = "0.23.0", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.5.1"
zcash_primitives = "0.31.0"
zcash_proofs = "0.31.0"
zcash_protocol = { version = "0.11.0", features = ["local-consensus"] }
zcash_pool_migration = { version = "0.2.0", features = ["wallet"] }
zcash_script = "0.6"
zip32 = "0.3"
pczt = { version = "0.10.0", features = ["prover", "orchard", "sapling", "signer"] }
shardtree = "0.8"

# Keystone hardware-wallet batch signing for the Orchard migration flow.
#
# Bypasses the compiled Keystone mobile SDKs (stale — single-PCZT only, no batch API) by
# depending directly on `keystone-sdk-rust`'s `ur-registry` crate and `ur-rs` from git, mirroring
# `chainapsis/vizor-wallet`'s verified-working pattern for the same integration (see
# `rust/src/migration_keystone.rs`'s module doc). The actual batching primitive is
# `pczt::roles::signer::batch` (the `signer` feature above), not Keystone-specific; these crates
# only provide the outer UR/QR envelope. `ur-registry`'s Zcash batch-signing types haven't reached
# a tagged release yet — Android's SDK floats this branch and its lock resolves exactly this rev;
# we pin it directly instead.
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
ur-registry = { git = "https://github.com/KeystoneHQ/keystone-sdk-rust", rev = "7c90bf1ae504720c3f4b44ff26f996836d8b1553", package = "ur-registry", default-features = false, features = [
    "std",
] }

# EIP-681
eip681 = "0.1.0"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
# The versions zcash_client_sqlite 0.23 uses (its external-migration trait objects are of these).
schemerz = "0.3"
schemerz-rusqlite = "0.371"
secrecy = "0.8"
rand = "0.10"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tor
fs-mistrust = "0.14"
tor-rtcompat = "0.43"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Zcash voting -- DISABLED in the ZChat NU7 fork (as in the Android NU7 fork).
#
# `zcash_voting` 3.0.0 requires the pre-NU7 crate set (zcash_client_backend 0.24, zcash_client_sqlite
# 0.22, zcash_keys 0.16, zcash_protocol 0.10, orchard 0.15, pczt 0.9, rand 0.8), and every later
# release (5.x) is built on the `zakura-*` crates instead; no release builds against the NU7 set.
# The sources (rust/src/voting.rs, rust/src/voting/*) are gated behind the bare
# `cfg(zcash_voting)` and are not built; the dependencies only they need are commented out with
# them. `pasta_curves`, `ff` and `zeroize` were used by the voting sources alone.
# zcash_voting = { version = "=3.0.0" }
# zeroize = "1"
# pasta_curves = "0.5"
# ff = "0.13"

# Used by the pool-migration engine as well as by voting.
zcash_keys = { version = "0.17.0", features = ["orchard"] }
incrementalmerkletree = { version = "0.9", default-features = false }

[dev-dependencies]
hex = "0.4"
tempfile = "3"
# Test-only (as in the Android NU7 fork): BIP 39 seeds of the fixture wallets and SHA-256 digests
# of the SDK 3.0.0 ground truth in `rust/src/test_vectors.rs`.
bip0039 = "0.12"
sha2 = "0.10"

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[features]
default = []

# `zcash_voting` is a bare cfg rather than a cargo feature: its dependency is commented out above,
# so there is nothing for a feature to gate. Declaring it keeps rustc from warning that
# `cfg(zcash_voting)` is an unknown condition.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_voting)'] }

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true

[patch.crates-io]
# DO NOT ALTER THIS COMMENT
#
# This section is left in place to ensure that development against in-progress
# librustzcash changes my proceed. DO NOT merge a PR that chooses unstable
# revisions; such a revision need not be merged to `librustzcash `main` but the
# author and reviewer should have certainty that the revision *will end up
# merged to `main`* so that commits in our history can always be successfully
# built.
#
# ZChat NU7 fork: no active patch; the crate set above is stable crates.io releases (as Android).
#pczt = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_address = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_pool_migration = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_proofs = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zcash_transparent = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }
#zip321 = { git = "https://github.com/zcash/librustzcash", rev = "REPLACE_ME" }

